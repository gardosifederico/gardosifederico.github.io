<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Lifecycle</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Mission Lifecycle Experience</h1>

    <p>
        This page summarizes my involvement throughout the lifecycle of
        multiple space missions according to the ECSS project phases.
    </p>
</header>

<main class="container">

    <section class="lifecycle">

        <div class="timeline">

            <!-- Header: Phase Groups -->
            <div class="phase phase0">Phase 0 / A</div>
            <div class="phase phaseBC">Phase B / C</div>
            <div class="phase phaseD">Phase D</div>
            <div class="phase phaseE">Phase E</div>

            <!-- Milestones -->
            <div class="milestone">MAR</div>
            <div class="milestone">MDR</div>
            <div class="milestone">SRR</div>
            <div class="milestone">PDR</div>
            <div class="milestone">CDR</div>
            <div class="milestone">IRR</div>
            <div class="milestone">TRR</div>
            <div class="milestone">MST / SVT</div>
            <div class="milestone">PTR</div>
            <div class="milestone">ORR</div>
            <div class="milestone">LRR</div>
            <div class="milestone">FAR</div>
            <div class="milestone">IOCR</div>

        </div>

        <div class="mission">
            <div class="mission-name">
                ESAIL (SAT-AIS)
            </div>

            <div class="mission-row">

                <div class="mission-bar esail"></div>

            </div>

        </div>

    </section>

</main>

</body>
</html>
