<div class="lifecycle-container">
<section class="lifecycle">

    <h1 class="lifecycle-title">
        Mission Lifecycle
    </h1>

    <div class="timeline-wrapper">

        <div class="timeline">

            <!-- Phase titles -->

            <div></div>

            <div class="phase phase0">Phase 0 / A</div>
            <div class="phase phaseBC">Phase B / C</div>
            <div class="phase phaseD">Phase D</div>
            <div class="phase phaseE">Phase E</div>

            <!-- Milestones -->

            <div></div>

            <div class="milestones">

                <div>MAR</div>
                <div>MDR</div>
                <div>SRR</div>

                <div>PDR</div>
                <div>CDR</div>

                <div>IRR</div>
                <div>TRR</div>
                <div>MST/SVT</div>
                <div>PTR</div>
                <div>ORR</div>

                <div>LRR</div>
                <div>FAR</div>
                <div>IOCR</div>

            </div>

            <!-- ===================== -->
            <!-- MISSIONS              -->
            <!-- ===================== -->

            <div class="mission-name">
                ESAIL (SAT-AIS)
            </div>

            <div class="mission-track">

                <div class="mission-bar" style="grid-column:6 / 14;"></div>

            </div>


            <div class="mission-name">
                SeRANIS (ATHENA-1)
            </div>

            <div class="mission-track">

                <div class="mission-bar" style="grid-column:4 / 10;"></div>

            </div>

            <div class="mission-name">
                KSM, KSF1, KSF2, KSF3
            </div>

            <div class="mission-track">

                <div class="mission-bar" style="grid-column:1 / 14;"></div>

            </div>

            <div class="mission-name">
                Triton-X
            </div>

            <div class="mission-track">

                <div class="mission-bar" style="grid-column:1 / 4;"></div>
                <div class="mission-bar" style="grid-column:5 / 9;"></div>

            </div>

            <div class="mission-name">
                NAVRAD
            </div>

            <div class="mission-track">

                <div class="mission-bar" style="grid-column:1 / 4;"></div>

            </div>

            <div class="mission-name">
                D3S
            </div>

            <div class="mission-track">

                <div class="mission-bar" style="grid-column:1 / 4;"></div>

            </div>

        </div>
    </div>
</div>
